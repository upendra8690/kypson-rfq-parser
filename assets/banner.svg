<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="RFQ Parser turns a messy buyer message into clean structured data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#1B1147"/>
      <stop offset="1" stop-color="#062C3B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono text { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .flow { stroke-dasharray: 10 10; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>

  <text x="640" y="84" text-anchor="middle" font-size="58" font-weight="800" fill="#FFFFFF">RFQ Parser</text>
  <text x="640" y="124" text-anchor="middle" font-size="23" fill="#C7D2FE">Messy buyer messages in. Clean, structured orders out.</text>

  <!-- Input message -->
  <text x="70" y="186" font-size="15" font-weight="700" letter-spacing="2" fill="#A78BFA">WHAT THE BUYER SENDS</text>
  <rect x="70" y="202" width="440" height="128" rx="18" fill="#FFFFFF" fill-opacity="0.09" stroke="#A78BFA" stroke-opacity="0.55"/>
  <text x="96" y="256" font-size="26" fill="#FFFFFF">bopp bags chahiye 40 hazaar,</text>
  <text x="96" y="296" font-size="26" fill="#FFFFFF">65 gsm, Nagpur</text>

  <!-- Arrow -->
  <line x1="530" y1="266" x2="680" y2="266" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" class="flow"/>
  <path d="M676 250 L704 266 L676 282 Z" fill="#22D3EE"/>
  <text x="615" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#E0E7FF">parse_rfq()</text>
  <text x="615" y="302" text-anchor="middle" font-size="14" fill="#A5B4FC">about 0.2 ms</text>

  <!-- Output -->
  <text x="726" y="186" font-size="15" font-weight="700" letter-spacing="2" fill="#22D3EE">WHAT YOUR SYSTEM GETS</text>
  <rect x="726" y="202" width="484" height="172" rx="18" fill="#020617" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.55"/>
  <g class="mono" font-size="19">
    <text x="752" y="238"><tspan fill="#94A3B8">category</tspan><tspan x="880" fill="#67E8F9">bopp_bag</tspan></text>
    <text x="752" y="266"><tspan fill="#94A3B8">quantity</tspan><tspan x="880" fill="#86EFAC">40000</tspan></text>
    <text x="752" y="294"><tspan fill="#94A3B8">unit</tspan><tspan x="880" fill="#67E8F9">pcs</tspan></text>
    <text x="752" y="322"><tspan fill="#94A3B8">gsm</tspan><tspan x="880" fill="#86EFAC">65</tspan></text>
    <text x="752" y="350"><tspan fill="#94A3B8">location</tspan><tspan x="880" fill="#67E8F9">Nagpur</tspan></text>
  </g>

  <text x="70" y="382" font-size="16" fill="#C7D2FE">English + Hindi  ·  Typos  ·  Lakh and hazaar</text>
</svg>
